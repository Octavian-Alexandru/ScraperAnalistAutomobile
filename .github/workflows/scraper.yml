name: Daily Car Market Pipeline

on:
  schedule:
    # 1. Jobul de zi (Arbitraj Rapid): orele 08:00, 12:00, 16:00, 20:00 UTC
    - cron: '0 8,12,16,20 * * *'
    # 2. Jobul de noapte (Mentenanță și Deep Scrape): ora 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      job_type:
        description: 'Tipul rularii: day_fast (Arbitraj Rapid) sau night_full (Mentenanta & Deep Scrape)'
        required: true
        default: 'day_fast'
        type: choice
        options:
          - day_fast
          - night_full
      pages:
        description: 'Numar pagini per scraper (optional override)'
        required: false
        default: ''

jobs:
  day-arbitrage:
    name: ⚡ Arbitraj Rapid (Job de Zi)
    if: github.event.schedule == '0 8,12,16,20 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job_type == 'day_fast')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Python 3.11
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Instalare dependinte
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt cloudscraper lxml optuna httpx httpx2
          playwright install --with-deps chromium

      # 3b. Verificare calitate cod (Teste Automate)
      - name: Run Tests
        run: python -m pytest tests/ -v --tb=short

      # 4. Rulare Pipeline Arbitraj Rapid (implicit 5 pagini cu Early Stopping activ)
      - name: Run Fast Arbitrage Pipeline
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PAGES="${{ github.event.inputs.pages || '5' }}"
          python run_daily_pipeline.py --pages $PAGES

      # 5. Commit si Push baza de date actualizata, parquet si raportul zilnic
      - name: Commit and Push Database & Results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git pull --rebase origin ${{ github.ref_name }} || git pull --rebase origin master || true
          git add data/cars.db data/ml_ready_listings.parquet results/ models/price_model_xgboost.joblib models/price_model.joblib data/fx_cache.json data/import_config.json
          git commit -m "⚡ [Arbitraj Rapid] Actualizare anunturi noi, Deal Scores si raport de piata" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }} || git push origin master || git push

  night-maintenance:
    name: 🌙 Mentenanta si Deep Scrape (Job de Noapte)
    if: github.event.schedule == '0 2 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job_type == 'night_full')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Python 3.11
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Instalare dependinte
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt cloudscraper lxml optuna httpx httpx2
          playwright install --with-deps chromium

      # 3b. Verificare calitate cod (Teste Automate)
      - name: Run Tests
        run: python -m pytest tests/ -v --tb=short

      # 4. Rulare Pipeline Complet (Full Deep Scrape fara Early Stopping + Retrain ML)
      - name: Run Full Night Pipeline
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PAGES_ARG=""
          if [ -n "${{ github.event.inputs.pages }}" ]; then
            PAGES_ARG="--pages ${{ github.event.inputs.pages }}"
          fi
          python run_daily_pipeline.py --full $PAGES_ARG

      # 5. Commit si Push baza de date, parquet si modelele ML re-antrenate
      - name: Commit and Push Database, Parquet & ML Models
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git pull --rebase origin ${{ github.ref_name }} || git pull --rebase origin master || true
          git add data/cars.db data/ml_ready_listings.parquet models/price_model_xgboost.joblib models/price_model.joblib results/ data/fx_cache.json data/import_config.json
          git commit -m "🌙 [Deep Scrape & ML] Sincronizare piata, curatare inactive, optimizare XGBoost si raport zilnic" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }} || git push origin master || git push
name: Daily Car Scraper

on:
  schedule:
    - cron: '0 17 * * *' # Rulează la 05:00 UTC (care înseamnă 08:00 în România)
  workflow_dispatch: # Păstrează asta ca să poți da și manual "Run workflow"

jobs:
  scrape-data:
    runs-on: ubuntu-latest

    # Oferim permisiunea ca botul să poată face push la modificări
    permissions:
      contents: write

    steps:
      # 1. Copiază codul tău pe serverul GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Instalează Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' # Poți folosi versiunea pe care o ai tu (ex: 3.10)

      # 3. Instalează librăriile necesare
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas beautifulsoup4 openpyxl

      # 4. Rulează scriptul tău
      - name: Run AutoUncle Scraper
        env:
          PYTHONUNBUFFERED: "1"
        run: python scraper_autoUncle.py

      # 5. Salvează fișierul Excel înapoi în GitHub
      - name: Commit and Push Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/raw_listings_old.xlsx
          git commit -m "🤖 Actualizare zilnică bază de date mașini" || echo "No changes to commit"
          git push

name: Daily Car Scraper

on:
  schedule:
    - cron: '0 3 * * *' # Rulează în fiecare noapte la ora 03:00 (ora serverului)
  workflow_dispatch: # Îți permite să declanșezi rularea și manual din interfața GitHub

jobs:
  scrape-data:
    runs-on: ubuntu-latest

    # Oferim permisiunea ca botul să poată face push la modificări
    permissions:
      contents: write

    steps:
      # 1. Copiază codul tău pe serverul GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Instalează Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' # Poți folosi versiunea pe care o ai tu (ex: 3.10)

      # 3. Instalează librăriile necesare
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas beautifulsoup4 openpyxl

      # 4. Rulează scriptul tău (aici pui doar scraperul fără browser)
      - name: Run AutoUncle Scraper
        run: python scraper_autoUncle.py

      # 5. Salvează fișierul Excel înapoi în GitHub
      - name: Commit and Push Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          # Adaugăm noul fișier Excel
          git add data/raw_listings_old.xlsx
          # Facem commit doar dacă există modificări
          git commit -m "🤖 Actualizare zilnică bază de date mașini" || echo "No changes to commit"
          git push
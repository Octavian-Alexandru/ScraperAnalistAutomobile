name: Daily Car Market Pipeline

on:
  schedule:
    # 1. Rulare Nocturna Adanca (ora 02:00 UTC): scaneaza tot, sincronizeaza DB si re-antreneaza ML
    - cron: '0 2 * * *'
    # 2. Rulari de Arbitraj de Peste Zi (orele 08:00, 14:00, 18:00 UTC): prind instant anunturile noi si caderile de pret
    - cron: '0 8,14,18 * * *'
  workflow_dispatch:
    inputs:
      pages:
        description: 'Numar maxim de pagini per scraper'
        required: false
        default: '25'
      skip_ml:
        description: 'Sari peste antrenarea ML (pentru scanare rapida de preturi)'
        type: boolean
        default: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python 3.11
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Instalare librarii necesare
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas beautifulsoup4 openpyxl pyarrow scikit-learn joblib playwright
          playwright install --with-deps chromium

      # 4. Rulare Pipeline (Sortare Newest + Early Stopping + SQLite + Parquet + ML)
      - name: Run Daily Pipeline
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PAGES="${{ github.event.inputs.pages || '25' }}"
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.skip_ml }}" = "true" ]; then
            EXTRA_FLAGS="--skip-ml"
          fi
          python run_daily_pipeline.py --pages $PAGES --all-scrapers $EXTRA_FLAGS


      # 5. Commit si Push actualizari automate
      - name: Commit and Push Updated Database & ML Models
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/cars.db data/ml_ready_listings.parquet models/price_model.joblib
          git commit -m "🤖 [Pipeline Auto] Actualizare zilnica date, preturi si model ML" || echo "No changes to commit"
          git push